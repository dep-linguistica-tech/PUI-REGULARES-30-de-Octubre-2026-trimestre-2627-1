<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIMET - Consulta de Resultados</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            position: relative;
        }
        .top-bar {
            height: 10px;
            background-color: #f26522;
        }
        .card-body {
            padding: 40px 30px;
            text-align: center;
        }
        .logo-title {
            color: #f26522;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }
        .sub-title {
            color: #0b2545;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .term-title {
            color: #0b2545;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 15px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
            color: #333;
        }
        input[type="text"]:focus {
            border-color: #f26522;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #f26522;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #d9531e;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            text-align: left;
            display: none;
        }
        .result-item {
            margin-bottom: 10px;
            font-size: 15px;
            color: #495057;
        }
        .result-item:last-child {
            margin-bottom: 0;
        }
        .result-item strong {
            color: #212529;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            background-color: #28a745;
            color: #ffffff;
            border-radius: 4px;
            font-weight: bold;
        }
        .error-msg {
            margin-top: 15px;
            color: #dc3545;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="top-bar"></div>
    <div class="card-body">
        <div class="logo-title">UNIMET</div>
        <div class="sub-title">PUI REGULARES 30 DE OCTUBRE</div>
        <div class="term-title">TRIMESTRE 2627-1</div>

        <div class="form-group">
            <input type="text" id="cedulaInput" placeholder="Ingrese su Cédula">
        </div>
        <button onclick="consultar()">Consultar</button>

        <div id="errorMsg" class="error-msg">Cédula no encontrada en el sistema.</div>

        <div id="resultBox" class="result-box">
            <div class="result-item"><strong>Nombre:</strong> <span id="resNombre"></span></div>
            <div class="result-item"><strong>Apellido:</strong> <span id="resApellido"></span></div>
            <div class="result-item"><strong>Nivel a Cursar:</strong> <span id="resNivel" class="badge"></span></div>
        </div>
    </div>
</div>

<script>
    let estudiantes = [];

    // Cargar los 107 datos del archivo JSON
    fetch('resultados.json')
        .then(res => res.json())
        .then(data => { estudiantes = data; })
        .catch(err => console.error("Error al cargar datos:", err));

    function consultar() {
        const input = document.getElementById('cedulaInput').value.trim();
        const resultBox = document.getElementById('resultBox');
        const errorMsg = document.getElementById('errorMsg');

        resultBox.style.display = 'none';
        errorMsg.style.display = 'none';

        if (!input) return;

        // Limpiar el string para comparar únicamente números de cédula
        const cleanCedula = input.replace(/\D/g, '');

        const estudiante = estudiantes.find(e => e.Cédula.toString() === cleanCedula);

        if (estudiante) {
            document.getElementById('resNombre').innerText = estudiante.Nombre;
            document.getElementById('resApellido').innerText = estudiante.Apellido;
            document.getElementById('resNivel').innerText = estudiante.Cursar;
            resultBox.style.display = 'block';
        } else {
            errorMsg.style.display = 'block';
        }
    }

    document.getElementById('cedulaInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            consultar();
        }
    });
</script>

</body>
</html>
