<html lang="es">

    <title>UNIMET - Consulta de Resultados</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        .top-bar {
            height: 12px;
            background-color: #f26522;
        }
        .card-body {
            padding: 40px 30px;
            text-align: center;
        }
        .logo-title {
            color: #f26522;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }
        .sub-title {
            color: #1a365d;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .term-title {
            color: #1a365d;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 28px;
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            color: #333333;
        }
        input[type="text"]::placeholder {
            color: #9ca3af;
        }
        input[type="text"]:focus {
            border-color: #f26522;
            box-shadow: 0 0 0 3px rgba(242, 101, 34, 0.15);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #f26522;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #d9531e;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            text-align: left;
            display: none;
        }
        .result-item {
            margin-bottom: 10px;
            font-size: 15px;
            color: #475569;
        }
        .result-item:last-child {
            margin-bottom: 0;
        }
        .result-item strong {
            color: #1e293b;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            background-color: #10b981;
            color: #ffffff;
            border-radius: 4px;
            font-weight: 700;
        }
        .error-msg {
            margin-top: 15px;
            color: #ef4444;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>

    function consultar() {
        const input = document.getElementById('cedulaInput').value.trim();
        const resultBox = document.getElementById('resultBox');
        const errorMsg = document.getElementById('errorMsg');

        resultBox.style.display = 'none';
        errorMsg.style.display = 'none';

        if (!input) return;

        // Eliminar puntos, letras o guiones del texto ingresado
        const cleanCedula = input.replace(/\D/g, '');

        const estudiante = estudiantes.find(e => e.Cédula.toString() === cleanCedula);

        if (estudiante) {
            document.getElementById('resNombre').innerText = estudiante.Nombre;
            document.getElementById('resApellido').innerText = estudiante.Apellido;
            document.getElementById('resCedula').innerText = estudiante.Cédula;
            document.getElementById('resNivel').innerText = estudiante.Cursar;
            resultBox.style.display = 'block';
        } else {
            errorMsg.style.display = 'block';
        }
    }

    document.getElementById('cedulaInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            consultar();
        }
    });
