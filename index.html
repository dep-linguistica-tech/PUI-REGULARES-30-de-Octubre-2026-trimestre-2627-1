  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background-color: #f5f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 440px;
      padding: 32px 24px;
      text-align: center;
      border-top: 6px solid #f26522;
    }
    .logo-text {
      color: #f26522;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .sub-title {
      color: #1a365d;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 24px;
      text-transform: uppercase;
    }
    .input-group {
      margin-bottom: 16px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #f26522;
    }
    button {
      width: 100%;
      background-color: #f26522;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #d95318;
    }
    .result-box {
      margin-top: 24px;
      padding: 20px;
      border-radius: 8px;
      display: none;
    }
    .result-box.success {
      background-color: #e6f4ea;
      border: 1px solid #ceead6;
      display: block;
    }
    .result-box.error {
      background-color: #fce8e6;
      border: 1px solid #fad2cf;
      color: #c5221f;
      display: block;
    }
    .student-name {
      color: #1a365d;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .level-label {
      color: #5f6368;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .level-assigned {
      color: #0d652d;
      font-size: 20px;
      font-weight: 800;
    }
  </style>
</head>

    function handleKeyPress(e) {

    function buscar() {
      const inputVal = document.getElementById('cedulaInput').value.replace(/\D/g, '');
      const resultBox = document.getElementById('resultBox');

      if (!inputVal) {
        resultBox.className = "result-box error";
        resultBox.innerHTML = "Por favor, ingrese un número de cédula válido.";
        return;
      }

      const alumno = data.find(item => String(item['Cédula']) === inputVal);

      if (alumno) {
        resultBox.className = "result-box success";
        resultBox.innerHTML = `
          <div class="student-name">${alumno.Nombre} ${alumno.Apellido}</div>
          <div class="level-label">Nivel Asignado:</div>
          <div class="level-assigned">${alumno.Cursar}</div>
        `;
