<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Resultados - Prueba de Nivelación</title>
    <style>
        :root {
            --primary: #004085;
            --bg: #f4f6f9;
            --card: #ffffff;
            --text: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: var(--card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: var(--primary);
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
        }
        button {
            padding: 12px 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #002752;
        }
        .result-card {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #fdfdfd;
            display: none;
        }
        .result-item {
            margin-bottom: 12px;
            font-size: 16px;
        }
        .result-item strong {
            color: #555;
        }
        .badge {
            display: inline-block;
            padding: 6px 12px;
            background-color: #28a745;
            color: white;
            border-radius: 4px;
            font-weight: bold;
        }
        .no-result {
            color: #d9534f;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Consulta de Resultados de Ubicación</h1>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Ingrese Cédula, Nombre o Apellido...">
        <button onclick="buscar()">Buscar</button>
    </div>

    <div id="noResult" class="no-result">No se encontraron registros con el criterio ingresado.</div>

    <div id="resultCard" class="result-card">
        <div class="result-item"><strong>Estudiante:</strong> <span id="resNombre"></span></div>
        <div class="result-item"><strong>Cédula:</strong> <span id="resCedula"></span></div>
        <div class="result-item"><strong>Nivel a Cursar:</strong> <span id="resCursar" class="badge"></span></div>
    </div>
</div>

<script>
    // Carga de datos de los 107 estudiantes desde resultados.json
    let estudiantes = [];

    fetch('resultados.json')
        .then(response => response.json())
        .then(data => { estudiantes = data; })
        .catch(err => console.error("Error cargando los datos:", err));

    function buscar() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const card = document.getElementById('resultCard');
        const noRes = document.getElementById('noResult');
        
        card.style.display = 'none';
        noRes.style.display = 'none';

        if (!query) return;

        const encontrado = estudiantes.find(est => 
            (est.Cédula && est.Cédula.toString() === query) ||
            (est.Nombre && est.Nombre.toLowerCase().includes(query)) ||
            (est.Apellido && est.Apellido.toLowerCase().includes(query)) ||
            (`${est.Nombre} ${est.Apellido}`.toLowerCase().includes(query))
        );

        if (encontrado) {
            document.getElementById('resNombre').innerText = `${encontrado.Nombre} ${encontrado.Apellido}`;
            document.getElementById('resCedula').innerText = encontrado.Cédula || 'N/A';
            document.getElementById('resCursar').innerText = encontrado.Cursar || 'Pendiente';
            card.style.display = 'block';
        } else {
            noRes.style.display = 'block';
        }
    }

    // Permitir buscar al presionar Enter
    document.getElementById('searchInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            buscar();
        }
    });
</script>

</body>
</html>
